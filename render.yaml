services:
  - type: web
    name: retail-market-basket
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 4 --timeout 180 app:app"
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: SEED_SAMPLE
        value: "true"
    healthCheckPath: /