{% extends "base.html" %}

{% block content %}
<div class="fade-up">
  <div class="d-flex align-center justify-between wrap gap-2 mb-3">
    <div>
      <h2 style="font-size:20px;font-weight:800"><i class="bi bi-file-earmark-text-fill text-primary"></i> Market Basket Analysis Report</h2>
      <div class="text-muted text-small">Auto-generated from the live analysis — all numbers are computed from your dataset</div>
    </div>
    <div class="d-flex align-center gap-2 no-print">
      <button class="btn btn-ghost" onclick="printReport()"><i class="bi bi-printer"></i> Print</button>
      <button class="btn btn-ghost" onclick="printReport()"><i class="bi bi-filetype-pdf"></i> Download PDF</button>
      <a class="btn btn-primary" href="/api/download-report" download><i class="bi bi-download"></i> Download Report (.txt)</a>
    </div>
  </div>

  <div id="reportArea">
    <div class="card"><div class="card-body"><div class="skeleton-card">
      <div class="skeleton skeleton-circle"></div>
      <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div>
      <div class="skeleton skeleton-line short"></div><div class="skeleton skeleton-line"></div>
    </div></div></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ static_v('js/reports.js') }}"></script>
{% endblock %}
